<div class="employee-page">

    <div class="employee-card">

        <!-- Form Section -->
        <div *ngIf="!isSubmitted">

            <div class="header-section">
                <h2>Add Employee</h2>
                <p>Enter employee details below</p>
            </div>

            <form
                #employeeForm="ngForm"
                (ngSubmit)="onSubmit(employeeForm)">

                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input
                        type="text"
                        class="form-control"
                        [(ngModel)]="employee.fullname"
                        name="fullname"
                        placeholder="Enter Full Name"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input
                        type="email"
                        class="form-control"
                        [(ngModel)]="employee.email"
                        name="email"
                        placeholder="Enter Email Address"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Date Of Joining</label>
                    <input
                        type="date"
                        class="form-control"
                        [(ngModel)]="employee.doj"
                        name="doj"
                        required>
                </div>

                <div class="mb-4">
                    <label class="form-label">Project</label>
                    <input
                        type="text"
                        class="form-control"
                        [(ngModel)]="employee.project"
                        name="project"
                        placeholder="Enter Project Name"
                        required>
                </div>

                <div class="button-group">

                    <button
                        type="submit"
                        class="btn btn-primary">
                        Add Employee
                    </button>

                    <button
                        type="button"
                        class="btn btn-outline-secondary"
                        (click)="goHome()">
                        Home
                    </button>

                </div>

            </form>

        </div>

        <!-- Success Message -->

        <div *ngIf="isSubmitted" class="success-card">

            <div class="success-icon">
                ✅
            </div>

            <h3>Employee Added Successfully!</h3>

            <p>
                Employee record has been saved.
            </p>

            <div class="button-group">

                <button
                    class="btn btn-primary"
                    (click)="goHome()">
                    Go Home
                </button>

                <button
                    class="btn btn-success"
                    (click)="viewEmployees()">
                    Employee List
                </button>

            </div>

        </div>

    </div>

</div>
