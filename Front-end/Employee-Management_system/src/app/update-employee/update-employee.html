<h2>Update Employee</h2>

<form (ngSubmit)="updateEmployee()">

  <p>
    <label>Full Name</label>
    <input
      type="text"
      name="fullname"
      [(ngModel)]="employee.fullname">
  </p>

  <p>
    <label>Email</label>
    <input
      type="email"
      name="email"
      [(ngModel)]="employee.email">
  </p>

  <p>
    <label>Date Of Joining</label>
    <input
      type="date"
      name="doj"
      [(ngModel)]="employee.doj">
  </p>

  <p>
    <label>Project</label>
    <input
      type="text"
      name="project"
      [(ngModel)]="employee.project">
  </p>

  <button type="submit">
    Update Employee
  </button>

</form>

<div class="action-buttons">
  <button class="back-btn" (click)="goBack()">
    Back
  </button>

  <button class="home-btn" (click)="goHome()">
    Home
  </button>
</div>
